<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Bills concept prototype (Paytm case study)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002E6E;--cyan:#00BAF2;--blue:#0A72C9;--ink:#101828;--sub:#475467;--mute:#98A2B3;
  --bg:#F2F5F9;--surface:#FFFFFF;--line:#E4EAF1;--tint:#E8F6FD;--green:#12B76A;--greenbg:#ECFDF3;--greenink:#067647;
  --gold:#F5A524;--goldbg:#FFF7E6;--goldink:#93590B;--orange:#FF5A1F;
  --r-card:18px;--r-btn:12px;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#E9EEF4;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{width:1em;height:1em;display:block}
/* ---------- page shell ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 32px 8px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.brand b{font-size:20px;color:var(--navy);display:block}
.brand span{color:var(--sub);font-size:13px}
.modes{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.modes button{padding:9px 18px;border-radius:999px;font-weight:600;font-size:14px;color:var(--sub)}
.modes button.on{background:var(--navy);color:#fff}
.stage{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:16px 24px 48px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.notes{width:400px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;position:sticky;top:16px;box-shadow:var(--shadow)}
.stepn{font-size:12px;font-weight:700;letter-spacing:1.4px;color:var(--blue);text-transform:uppercase}
.notes h2{font-size:22px;color:var(--navy);margin:6px 0 10px;line-height:1.25;letter-spacing:-.2px}
.notes p.what{font-size:15px;line-height:1.55;color:var(--ink)}
.tag{margin-top:12px;padding:12px 14px;border-radius:14px;background:#F7F9FC;border:1px solid var(--line)}
.tag .k{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.tag .v{font-size:14px;line-height:1.5;color:var(--ink)}
.tag.change{background:var(--tint);border-color:#C5E9FA}
.today{margin-top:12px}
.today .k{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.today img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.ctrls{display:flex;align-items:center;gap:10px;margin-top:20px}
.ctrls button{border:1.5px solid var(--navy);color:var(--navy);font-weight:700;padding:10px 18px;border-radius:12px;font-size:14px;background:#fff}
.ctrls button.next{background:var(--navy);color:#fff}
.ctrls button:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;max-width:120px;justify-content:flex-end}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--navy)}
.help{font-size:14px;line-height:1.55;color:var(--sub)}
.help b{color:var(--navy)}
/* ---------- phone ---------- */
.phone{width:394px;height:852px;border-radius:56px;background:#0A0D14;padding:12px;box-shadow:0 40px 80px rgba(0,46,110,.22),inset 0 0 0 2px #2A2F3A;flex-shrink:0;position:relative}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:80}
.sw{width:370px;height:828px;border-radius:46px;overflow:hidden;position:relative;background:var(--bg)}
.scr{position:absolute;inset:0;display:none;overflow:hidden;background:var(--bg)}
.scr.on{display:block;animation:in .28s ease}
@keyframes in{from{opacity:.3;transform:translateX(10px)}to{opacity:1;transform:none}}
.sb{height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 8px;font-size:15px;font-weight:600;position:relative;z-index:5}
.sb .r{display:flex;gap:6px;align-items:center;font-size:14px}
.sb .bat{width:24px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative}
.sb .bat:after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:14px;background:currentColor;border-radius:1.5px}
.hot{cursor:pointer}
.ring{position:absolute;border:3px solid var(--orange);border-radius:16px;pointer-events:none;display:none;z-index:90;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,90,31,.5)}70%{box-shadow:0 0 0 12px rgba(255,90,31,0)}100%{box-shadow:0 0 0 0 rgba(255,90,31,0)}}
.flash .hot{outline:3px solid rgba(10,114,201,.6);outline-offset:3px;border-radius:12px}
/* ---------- shared UI ---------- */
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 14px 12px;padding:16px}
.h-sec{font-size:17px;font-weight:700;letter-spacing:-.2px}
.cap{font-size:12px;color:var(--sub)}
.btn{background:var(--navy);color:#fff;border-radius:var(--r-btn);padding:10px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.block{display:flex;width:100%;justify-content:center;padding:16px;font-size:16px;border-radius:14px}
.btn.ghost{background:var(--tint);color:var(--navy)}
.pillg{display:inline-flex;align-items:center;gap:4px;background:var(--greenbg);color:var(--greenink);font-weight:700;font-size:11.5px;padding:3px 8px;border-radius:8px}
.pillgold{display:inline-flex;align-items:center;gap:4px;background:var(--goldbg);color:var(--goldink);font-weight:700;font-size:11.5px;padding:3px 8px;border-radius:8px}
.newb{position:absolute;top:-9px;right:14px;background:var(--orange);color:#fff;font-size:10px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:8px}
.hdr{display:flex;align-items:center;gap:12px;padding:4px 18px 14px;background:#fff}
.hdr .ib{font-size:22px;color:var(--ink)}
.hdr h3{font-size:18px;font-weight:700}
.foot{position:absolute;left:16px;right:16px;bottom:28px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;z-index:20;box-shadow:0 8px 24px rgba(16,24,40,.25)}
.toast svg{color:#5EE29B}
/* ---------- Paytm home ---------- */
.home{background:linear-gradient(180deg,#D9F0FF 0,#EEF7FF 170px,var(--bg) 300px);height:100%}
.ph{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 14px}
.ph .l{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:#FFD9A8;color:#7A3E00;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.wm{display:flex;align-items:flex-end;gap:5px}
.wm img{height:22px;width:auto;display:block}
.wm small{font-size:10px;font-weight:800;color:var(--navy);letter-spacing:.4px;line-height:1;padding-bottom:2px}
.ph .r{display:flex;gap:18px;font-size:22px;color:var(--navy)}
.mt{display:flex;justify-content:space-between;margin-top:12px}
.mt .it{width:72px;text-align:center;font-size:11.5px;color:var(--ink);font-weight:500}
.mt .ic{width:48px;height:48px;border-radius:14px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 6px}
.chipsrow{display:flex;gap:8px;padding:0 14px 12px;overflow:hidden}
.chipsrow span{background:#fff;border-radius:10px;padding:8px 8px;font-size:11.5px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow)}
.hb{position:relative;border:1.5px solid #BFE6FA}
.hbtop{display:flex;align-items:center;justify-content:space-between}
.editb{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--blue);padding:6px 10px;border-radius:10px;background:var(--tint)}
.prog{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.bar{flex:1;height:10px;border-radius:99px;background:#E6EEF6;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--navy));transition:width 1.2s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.prog b{font-size:12.5px;color:var(--navy);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{border-radius:16px;padding:10px 6px 9px;text-align:center;font-size:11.5px;font-weight:600;position:relative;min-height:84px}
.tile .ti{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;margin:0 auto 6px}
.tile small{display:block;font-weight:500;font-size:10.5px;margin-top:2px}
.tile.set{background:var(--navy);color:#fff}
.tile.set .ti{background:rgba(255,255,255,.14);color:#fff}
.tile.set small{color:#A9CBF2}
.tile.set .ok{position:absolute;top:6px;right:6px;width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.tile.add{background:#F7FAFD;border:1.5px dashed #C3D3E3;color:var(--sub)}
.tile.add .ti{background:#fff;color:var(--navy);border:1px solid var(--line)}
.tile.add small{color:var(--blue);font-weight:700}
.tile.next{border-color:var(--blue);background:var(--tint)}
.sug{display:flex;align-items:center;gap:12px;margin-top:12px;background:#F7FAFD;border-radius:14px;padding:12px}
.sug .si{width:40px;height:40px;border-radius:12px;background:var(--goldbg);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sug .st{flex:1}
.sug .st b{font-size:13.5px;display:block;margin-bottom:3px}
.more{display:flex;justify-content:space-between}
.more .it{text-align:center;font-size:11px;width:70px;color:var(--ink)}
.more .ic{width:42px;height:42px;border-radius:12px;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:19px;margin:0 auto 6px}
.scanqr{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(0,46,110,.35)}
/* ---------- sheet ---------- */
.blurbg{position:absolute;inset:0;filter:blur(6px) saturate(.9);transform:scale(1.03)}
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:12px 18px 30px;box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
.grab{width:40px;height:5px;border-radius:9px;background:#D0D9E3;margin:0 auto 16px}
.sheet h4{font-size:19px;letter-spacing:-.2px}
.sheet .sub{font-size:13.5px;color:var(--sub);margin:4px 0 16px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.opt.rec{border-color:var(--blue);background:var(--tint)}
.opt .oi{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--navy);flex-shrink:0}
.opt .ot{flex:1}
.opt b{display:flex;align-items:center;gap:6px;font-size:14.5px}
.opt small{font-size:12.5px;color:var(--sub)}
.opt .ch{color:var(--mute);font-size:18px}
.tagb{font-size:10px;font-weight:800;color:#fff;background:var(--blue);padding:2px 7px;border-radius:6px;letter-spacing:.4px}
/* ---------- camera ---------- */
.cam{background:#0B0B0D;height:100%;color:#fff;position:relative}
.camtop{display:flex;justify-content:space-between;align-items:center;padding:4px 20px;font-size:22px}
.camtitle{text-align:center;font-weight:600;font-size:15px;margin-top:2px;opacity:.9}
.paper{position:absolute;left:44px;right:44px;top:150px;height:390px;background:#FBFAF6;border-radius:6px;transform:rotate(-2deg);color:#3a3a3a;padding:20px 18px;font-size:11px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.paper .bt{font-weight:800;font-size:13px;color:#1d4e89;letter-spacing:.2px}
.paper .ln{height:7px;background:#E7E4DA;border-radius:4px;margin:9px 0}
.paper .cn{margin-top:16px;font-weight:700;font-size:12.5px;display:inline-block;padding:4px 6px;border-radius:6px;position:relative}
.paper .cn.hit{background:rgba(0,186,242,.18);outline:2.5px solid var(--cyan);animation:blink 1.4s infinite}
@keyframes blink{50%{outline-color:#fff}}
.vf{position:absolute;left:30px;right:30px;top:130px;height:430px;pointer-events:none}
.vf i{position:absolute;width:34px;height:34px;border:4px solid #fff;border-radius:6px}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.found{position:absolute;left:14px;right:14px;bottom:26px;background:#fff;color:var(--ink);border-radius:22px;padding:16px}
.found .ok{display:flex;align-items:center;gap:6px;color:var(--greenink);font-weight:700;font-size:12px;letter-spacing:.6px}
.found .bi{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.logo{width:42px;height:42px;border-radius:12px;background:#E9F1FB;color:#1d4e89;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* ---------- bill + success ---------- */
.amt{font-size:34px;font-weight:800;letter-spacing:-.8px;margin:12px 0 4px}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--sub);background:#F2F5F9;padding:4px 9px;border-radius:8px}
.rw{border:1.5px solid #ABEFC6;background:var(--greenbg)}
.rw .k{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--greenink);text-transform:uppercase;margin-bottom:8px}
.rw .r{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:5px 0}
.rw .r b{color:var(--greenink)}
.feerow{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:var(--sub)}
.guar{display:flex;gap:12px;align-items:flex-start}
.guar .gi{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--navy);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.guar p{font-size:12.5px;line-height:1.5;color:var(--sub)}
.guar b{color:var(--ink)}

.win{height:100%;background:var(--bg);position:relative;overflow:hidden}
.wk{background:linear-gradient(180deg,#002E6E,#0A4F8F);color:#fff;text-align:center;padding:8px 20px 26px;border-radius:0 0 30px 30px;position:relative}
.wk .wok{width:76px;height:76px;border-radius:50%;background:var(--green);color:#fff;font-size:42px;display:flex;align-items:center;justify-content:center;margin:6px auto 12px;box-shadow:0 0 0 10px rgba(18,183,106,.25);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.wk h3{font-size:28px;letter-spacing:-.5px;margin:0 0 4px}
.wk p{font-size:14.5px;opacity:.9}
.wk .wamt{font-size:44px;font-weight:800;letter-spacing:-1.2px;margin:10px 0 2px}
.wk small{font-size:11.5px;opacity:.75;display:block}
.cfw{position:absolute;left:0;right:0;top:0;height:300px;overflow:hidden;pointer-events:none;z-index:5}
.cf{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall 2.6s ease-in both}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(300px) rotate(540deg);opacity:0}}
.wcard{margin-top:14px}
.wsh{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:2px}
.wr{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px}
.wr span{color:var(--green);font-size:15px;display:flex}
.wst{display:flex;gap:8px;margin-top:8px}
.wst div{flex:1;background:var(--greenbg);border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;color:var(--greenink)}
.wst b{display:block;font-size:17px;color:var(--ink);margin-bottom:1px}
.wnext{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 14px 0;font-size:12.5px;color:var(--sub);font-weight:600}
.chipsrow span.offchip{display:inline-flex;align-items:center;gap:4px;color:var(--navy);font-weight:700}
.bigok{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:8px auto 10px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.tl{position:relative;margin-top:4px}
.tl .s{display:flex;gap:12px;align-items:center;padding:7px 0;font-size:14px;opacity:.25;transition:opacity .4s}
.tl .s.on{opacity:1}
.tl .s i{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tl .s small{display:block;color:var(--sub);font-size:11.5px}
.rewrow{display:flex;gap:8px;justify-content:center;margin:4px 0 2px}
/* ---------- edit (control centre style) ---------- */
.edit{background:linear-gradient(180deg,#0E2448,#173A6E 60%,#1E4A86);height:100%;color:#fff}
.edtop{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 4px}
.edtop h3{font-size:20px;font-weight:700}
.done{background:#fff;color:var(--navy);font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px}
.edsub{padding:0 20px 14px;font-size:13px;color:#BFD3EE}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:6px 22px 18px}
.et{aspect-ratio:1;border-radius:22px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;position:relative;border:1px solid rgba(255,255,255,.18)}
.et span{font-size:10.5px;font-weight:600;margin-top:5px}
.et .mn{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;background:#D7DEE8;color:#1A2433;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.et.empty{background:rgba(255,255,255,.05);border:1.5px dashed rgba(255,255,255,.28)}
.et.newin{animation:land .5s cubic-bezier(.2,1.4,.4,1);background:rgba(0,186,242,.35);border-color:#7FD6F7}
@keyframes land{from{transform:scale(.4)}to{transform:none}}
.wig .et:not(.empty){animation:wig .35s ease-in-out infinite alternate}
.wig .et:nth-child(2n){animation-delay:.12s}
@keyframes wig{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.addlist{background:#fff;color:var(--ink);border-radius:26px 26px 0 0;position:absolute;left:0;right:0;bottom:0;top:330px;padding:16px 18px}
.addlist h5{font-size:15px;margin-bottom:6px}
.ar{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EEF2F6}
.ar .ai{width:38px;height:38px;border-radius:11px;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:18px}
.ar .at{flex:1;font-size:14px;font-weight:600}
.ar .at small{display:block;font-weight:500;font-size:11.5px;color:var(--sub)}
.ar .ap{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.ar.muted .at{color:var(--sub)}
/* ---------- offers ---------- */
.rsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rsum > div{border-radius:14px;padding:12px;background:#F7F9FC;border:1px solid var(--line)}
.rsum b{display:block;font-size:20px;letter-spacing:-.4px}
.rsum small{font-size:11.5px;color:var(--sub)}
.gbar{height:6px;border-radius:9px;background:#F1E3C4;margin-top:8px;overflow:hidden}
.gbar i{display:block;height:100%;width:13%;background:var(--gold);border-radius:9px}
.of{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #EEF2F6}
.of:first-of-type{border-top:0}
.of .oi{width:42px;height:42px;border-radius:12px;background:var(--tint);color:var(--navy);font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.of .ot{flex:1}
.of b{font-size:14px;display:block}
.of small{font-size:11.5px;color:var(--sub)}
.why{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--blue);background:var(--tint);border-radius:6px;padding:2px 6px;margin-top:4px}
.promo{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--navy),#0A5BB5);color:#fff;border-radius:18px;padding:16px}
.promo .pi{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.15);font-size:22px;display:flex;align-items:center;justify-content:center}
.promo b{font-size:15px;display:block}
.promo small{font-size:12px;color:#BFD8F5}
/* ---------- ghar set, one bill ---------- */
.hero{background:linear-gradient(160deg,#002E6E,#0A5BB5);color:#fff;padding:0 20px 22px;position:relative}
.hero .sb{padding:0 10px 8px;color:#fff}
.hero .bk{font-size:22px;margin:4px 0 10px}
.hero .lb{font-size:11.5px;font-weight:700;letter-spacing:1.3px;color:#9FD3F5;text-transform:uppercase}
.hero h3{font-size:26px;margin:4px 0 6px;letter-spacing:-.4px}
.hero p{font-size:13.5px;color:#D3E5F8;line-height:1.5}
.ring4{display:flex;align-items:center;gap:14px;margin-top:14px;background:rgba(255,255,255,.1);border-radius:16px;padding:12px}
.ring4 .rg{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--cyan) 0 75%,rgba(255,255,255,.2) 75% 100%);display:flex;align-items:center;justify-content:center}
.ring4 .rg span{width:40px;height:40px;border-radius:50%;background:#0B4C9B;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px}
.slot{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--shadow);font-size:12px;color:var(--sub)}
.slot .si{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.slot b{display:block;color:var(--ink);font-size:14px}
.slot .okk{color:var(--greenink);font-weight:700;display:flex;align-items:center;gap:4px;margin-top:4px}
.slot.open{background:#F7FAFD;border:1.5px dashed #C3D3E3;box-shadow:none}
.slot.open .si{background:#fff;color:var(--navy);border:1px solid var(--line)}
.lad .lr{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:7px 0;color:var(--sub)}
.lad .lr b{color:var(--ink)}
.lad .lr.cur{color:var(--navy);font-weight:700}
.fam{display:flex;align-items:center;gap:12px;background:var(--goldbg);border:1px solid #F7D9A0;border-radius:16px;padding:13px;margin:0 14px}
.fam .fi{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--goldink);font-size:20px;display:flex;align-items:center;justify-content:center}
.fam .ft{flex:1;font-size:12.5px;color:var(--goldink)}
.fam .ft b{display:block;font-size:14px;color:var(--ink)}
.obtot{font-size:34px;font-weight:800;letter-spacing:-.8px}
.bl{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #EEF2F6}
.bl .bi{width:38px;height:38px;border-radius:11px;background:var(--tint);color:var(--navy);font-size:18px;display:flex;align-items:center;justify-content:center}
.bl .bt{flex:1;font-size:14px;font-weight:600}
.bl .bt small{display:block;font-weight:500;font-size:11.5px;color:var(--sub)}
.streak{display:flex;gap:5px;margin-top:10px}
.streak span{flex:1;height:8px;border-radius:9px;background:var(--gold)}
.streak span.off{background:#F1E3C4}
.later{margin:0 14px;border:1.5px dashed #C3D3E3;border-radius:14px;padding:11px 12px;font-size:12px;color:var(--sub);line-height:1.45}
/* ---------- whatsapp ---------- */
.wa{background:#EFE7DE;height:100%;display:flex;flex-direction:column}
.wa .top2{background:#008069;color:#fff}
.wa .sb{color:#fff}
.wa .wh{display:flex;align-items:center;gap:10px;padding:4px 14px 12px;font-size:20px}
.wa .wav{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;letter-spacing:-.3px}
.wa .wav img{width:29px;height:auto;display:block}
.wa .wn{flex:1;font-size:15px;font-weight:600}
.wa .wn small{display:block;font-size:11.5px;font-weight:400;opacity:.85}
.wa .icons{display:flex;gap:18px}
.wa .chat{padding:16px 14px;flex:1}
.wa .day{text-align:center;margin-bottom:14px}
.wa .day span{background:#fff;font-size:11.5px;padding:5px 10px;border-radius:8px;color:#54656F;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.bub{background:#fff;border-radius:2px 14px 14px 14px;padding:10px 12px 6px;max-width:292px;font-size:14.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bub .t{font-size:11px;color:#8696A0;text-align:right;margin-top:4px}
.wab{background:#fff;margin-top:2px;max-width:292px;border-radius:12px;text-align:center;padding:11px;color:#027EB5;font-weight:600;font-size:14.5px;box-shadow:0 1px 1px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;gap:6px}
.wa .note{font-size:11.5px;color:#54656F;margin-top:12px;max-width:292px;background:rgba(255,255,255,.6);padding:8px 10px;border-radius:10px}
.end{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:30px;background:linear-gradient(180deg,#fff,#E3F4FD)}
.end .ei{width:84px;height:84px;border-radius:24px;background:var(--navy);color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center}
.end h3{color:var(--navy);font-size:22px;margin:16px 0 8px;letter-spacing:-.3px}
.end p{color:var(--sub);font-size:14px;line-height:1.55}
.stats{display:flex;gap:10px;margin:18px 0 24px}
.stats div{background:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);font-size:12px;color:var(--sub)}
.stats b{display:block;font-size:18px;color:var(--ink)}
@media (max-width:880px){.notes{position:static;order:2}}
@media (max-width:430px){.phone{transform:scale(.86);transform-origin:top center;margin-bottom:-110px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><b>Home Bills: concept prototype</b><span>For a Paytm case study by Vishwa Shah (ISB). Not a Paytm product: no real payments, synthetic data.</span></div>
  <div class="modes"><button id="mDemo" class="on">Guided demo</button><button id="mFree">Explore freely</button></div>
</div>
<div class="stage">
  <div class="notes" id="notes"></div>
  <div class="phone"><div class="island"></div><div class="sw" id="sw"><div class="ring" id="ring"></div></div></div>
</div>

function editScreen(added) {
  const grid = ["phone:Mobile", "zap:Electricity"].concat(added ? ["flame:LPG"] : []).map((t, i) => {
    const [ico, l] = t.split(":");
    return `<div class="et ${added && i === 2 ? "newin" : ""}"><span class="mn">${ic("minus")}</span>${ic(ico)}<span>${l}</span></div>`;
  }).join("") + `<div class="et empty"></div>`.repeat(added ? 5 : 6);
  const rows = [["flame", "LPG cylinder", "₹30 back on your first booking", true], ["tv", "DTH", "Tata Play, Airtel, Dish TV"], ["wifi", "Broadband", "200+ providers"], ["drop", "Water", "Municipal bills"], ["car", "FASTag", "Shown only if you add it", false, true]]
    .filter(r => !(added && r[0] === "flame"));
  const list = rows.map((r, i) => `<div class="ar ${r[4] ? "muted" : ""}"><div class="ai">${ic(r[0])}</div><div class="at">${r[1]}<small>${r[2]}</small></div><button class="ap ${!added && i === 0 ? "hot" : ""}" ${!added && i === 0 ? 'id="h8" data-go="s8b"' : ""}>${ic("plus")}</button></div>`).join("");
  return `<div class="edit ${added ? "" : "wig"}">${sb(true)}
    <div class="edtop"><h3>Edit home bills</h3><button class="done ${added ? "hot" : ""}" ${added ? 'id="h8b" data-go="s8c"' : ""}>Done</button></div>
    <div class="edsub">Keep only the bills you pay. Remove the rest.</div>
    <div class="egrid">${grid}</div>
    <div class="addlist"><h5>Add a bill</h5>${list}</div>
  </div>`;

const sw = document.getElementById("sw");
Object.entries(SCREENS).forEach(([id, html]) => { const d = document.createElement("div"); d.className = "scr"; d.id = id; d.innerHTML = html; sw.insertBefore(d, document.getElementById("ring")); });
let mode = "demo", idx = 0, cur = "s0";
const $ = id => document.getElementById(id);
function show(sid) { document.querySelectorAll(".scr").forEach(e => e.classList.toggle("on", e.id === sid)); cur = sid; enter(sid); setTimeout(placeRing, 30); setTimeout(placeRing, 420); }
function enter(sid) {

    const st = [...document.querySelectorAll("#tl5 .s")]; st.forEach(e => e.classList.remove("on"));

  }
}
function placeRing() {
  const r = $("ring");
  if (mode !== "demo") { r.style.display = "none"; return; }
  const step = STEPS[idx], el = $(step.h);
  if (!el || step.s !== cur) { r.style.display = "none"; return; }
  const a = sw.getBoundingClientRect(), b = el.getBoundingClientRect(), sc = a.width / sw.offsetWidth;
  r.style.display = "block"; r.style.left = ((b.left - a.left) / sc - 6) + "px"; r.style.top = ((b.top - a.top) / sc - 6) + "px";
  r.style.width = (b.width / sc + 12) + "px"; r.style.height = (b.height / sc + 12) + "px";
}

  }

    <div class="ctrls"><button id="bk" ${idx === 0 ? "disabled" : ""}>Back</button><button class="next" id="nx">${idx === STEPS.length - 1 ? "Restart prototype" : "Next"}</button><div class="dots">${STEPS.map((_, i) => `<i class="${i === idx ? "on" : ""}"></i>`).join("")}</div></div>`;
  $("bk").onclick = () => go(idx - 1); $("nx").onclick = () => go(idx === STEPS.length - 1 ? 0 : idx + 1);
}
function go(i) { idx = Math.max(0, Math.min(STEPS.length - 1, i)); show(STEPS[idx].s); notes(); }
sw.addEventListener("click", e => {
